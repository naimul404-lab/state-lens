<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StateLens</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <div class="container">
        <h1>StateLens</h1>
        <p class="subtitle">
          Transform event sequences into system states, transitions, and edge-case patterns.
          Great for debugging flows, modeling systems, and spotting hidden failure paths.
        </p>
      </div>
    </header>

    <main class="container grid">
      <section class="card">
        <form id="scenarioForm">
          <label>
            Scenario name
            <input id="scenarioName" type="text" placeholder="Login flow, vending machine, queue system..." />
          </label>

          <label>
            Events
            <textarea id="eventsInput" placeholder="Enter events one per line or separated by commas&#10;start&#10;login&#10;verify&#10;success"></textarea>
          </label>

          <button type="submit">Analyze scenario</button>
        </form>

        <h3>Saved scenarios</h3>
        <ul id="scenarioList"></ul>
      </section>

      <section class="card">
        <div id="results">
          <p class="empty">Upload or analyze a scenario to see states and anomalies.</p>
        </div>
      </section>
    </main>

    <script src="/script.js"></script>
  </body>
</html>
